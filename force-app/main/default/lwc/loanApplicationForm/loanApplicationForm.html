<template>
  <lightning-card title="Loan Application" icon-name="custom:custom18">
    <div class="slds-p-horizontal_medium slds-is-relative">
      <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-around_large">
          <lightning-spinner
            alternative-text="Loading your application"
            size="small"
          ></lightning-spinner>
        </div>
      </template>

      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
          role="alert"
        >
          <p>{errorMessage}</p>
        </div>
      </template>

      <template lwc:if={successMessage}>
        <div
          class="slds-box slds-theme_success slds-m-bottom_small"
          role="status"
        >
          <p>{successMessage}</p>
        </div>
      </template>

      <template lwc:if={applicant}>
        <h2 class="slds-text-heading_small slds-m-bottom_x-small">
          Your business
        </h2>
        <dl class="slds-list_horizontal slds-wrap slds-m-bottom_medium">
          <dt class="slds-item_label slds-text-color_weak">Business</dt>
          <dd class="slds-item_detail">{applicant.businessName}</dd>
          <dt class="slds-item_label slds-text-color_weak">Structure</dt>
          <dd class="slds-item_detail">{applicant.businessStructure}</dd>
          <dt class="slds-item_label slds-text-color_weak">Established</dt>
          <dd class="slds-item_detail">{applicant.yearEstablished}</dd>
          <dt class="slds-item_label slds-text-color_weak">Industry</dt>
          <dd class="slds-item_detail">{applicant.industry}</dd>
          <dt class="slds-item_label slds-text-color_weak">Applicant</dt>
          <dd class="slds-item_detail">{applicant.contactName}</dd>
        </dl>

        <template lwc:if={isSubmitted}>
          <h2 class="slds-text-heading_small slds-m-bottom_x-small">
            Application {application.name}: {application.status}
          </h2>
          <dl class="slds-list_horizontal slds-wrap">
            <dt class="slds-item_label slds-text-color_weak">Product</dt>
            <dd class="slds-item_detail">{productLabel}</dd>
            <dt class="slds-item_label slds-text-color_weak">Purpose</dt>
            <dd class="slds-item_detail">{purposeLabel}</dd>
            <dt class="slds-item_label slds-text-color_weak">Amount</dt>
            <dd class="slds-item_detail">
              <lightning-formatted-number
                value={application.requestedAmount}
                format-style="currency"
              ></lightning-formatted-number>
            </dd>
            <dt class="slds-item_label slds-text-color_weak">Term</dt>
            <dd class="slds-item_detail">
              {application.requestedTermMonths} months
            </dd>
            <dt class="slds-item_label slds-text-color_weak">Submitted</dt>
            <dd class="slds-item_detail">
              <lightning-formatted-date-time
                value={application.submittedDate}
                time-zone="UTC"
              ></lightning-formatted-date-time>
            </dd>
          </dl>
        </template>

        <template lwc:if={isEditable}>
          <h2 class="slds-text-heading_small slds-m-bottom_x-small">
            {formHeading}
          </h2>
          <lightning-layout multiple-rows>
            <lightning-layout-item
              size="12"
              medium-device-size="6"
              padding="horizontal-small"
            >
              <lightning-combobox
                label="Loan product"
                data-field="loanProduct"
                options={productOptions}
                value={application.loanProduct}
                placeholder="Choose a product"
                required
                disabled={isSaving}
                onchange={handleChange}
              ></lightning-combobox>
            </lightning-layout-item>
            <lightning-layout-item
              size="12"
              medium-device-size="6"
              padding="horizontal-small"
            >
              <lightning-combobox
                label="What the money is for"
                data-field="loanPurpose"
                options={purposeOptions}
                value={application.loanPurpose}
                placeholder="Choose a purpose"
                required
                disabled={isSaving}
                onchange={handleChange}
              ></lightning-combobox>
            </lightning-layout-item>
            <lightning-layout-item
              size="12"
              medium-device-size="6"
              padding="horizontal-small"
            >
              <lightning-input
                type="number"
                label="Amount requested"
                data-field="requestedAmount"
                formatter="currency"
                step="0.01"
                min="0.01"
                value={application.requestedAmount}
                field-level-help="Needed to save a draft."
                required
                disabled={isSaving}
                onchange={handleChange}
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item
              size="12"
              medium-device-size="6"
              padding="horizontal-small"
            >
              <lightning-input
                type="number"
                label="Term (months)"
                data-field="requestedTermMonths"
                step="1"
                min="1"
                max="360"
                value={application.requestedTermMonths}
                required
                disabled={isSaving}
                onchange={handleChange}
              ></lightning-input>
            </lightning-layout-item>
          </lightning-layout>

          <template lwc:if={isConfirmingSubmit}>
            <div
              class="slds-box slds-theme_shade slds-m-top_medium"
              role="alertdialog"
              aria-labelledby="confirm-heading"
            >
              <p id="confirm-heading" class="slds-m-bottom_small">
                Submit this application? You won't be able to change it
                afterwards.
              </p>
              <lightning-button
                label="Cancel"
                onclick={handleCancelSubmit}
              ></lightning-button>
              <lightning-button
                class="slds-m-left_x-small"
                variant="brand"
                label="Yes, submit"
                onclick={handleConfirmSubmit}
              ></lightning-button>
            </div>
          </template>
          <template lwc:else>
            <div class="slds-m-top_medium slds-text-align_right">
              <lightning-button
                label="Save draft"
                disabled={isSaving}
                onclick={handleSaveDraft}
              ></lightning-button>
              <lightning-button
                class="slds-m-left_x-small"
                variant="brand"
                label="Submit application"
                disabled={isSaving}
                onclick={handleSubmit}
              ></lightning-button>
            </div>
          </template>
        </template>
      </template>

      <template lwc:if={isSaving}>
        <lightning-spinner
          alternative-text="Saving"
          size="small"
        ></lightning-spinner>
      </template>
    </div>
  </lightning-card>
</template>
